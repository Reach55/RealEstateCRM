<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Dashboard | Real Estate CRM</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
        }

        .main {
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-top: 25px;
            border-left: 5px solid #ffca32;
        }

        .logout {
            background: #ffca32;
            color: #222;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
        }

        @media(max-width: 800px) { .main { padding: 18px; } }
    </style>
</head>

<body>
{% include 'partials/site_header.html' %}


<div class="main">

    <div class="topbar">
        <div>
            <h2>Agent Dashboard</h2>
            <p>Welcome, {{ request.user.username }}</p>
        </div>

        <a href="{% url 'logout' %}" class="logout">Logout</a>
    </div>

    <div class="card">
        <h2>Welcome Back!</h2>
        <p>Manage your customers, properties and sales here.</p>
        <p>Account: {{ request.user.username }}</p>
        <p>Role: {{ request.user.get_role_display }}</p>
    </div>

</div>

</body>
</html>

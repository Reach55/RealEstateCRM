<style>
  .global-site-header{position:relative;z-index:20;background:#fff;color:#17243a;border-bottom:1px solid #e7edf5;box-shadow:0 4px 18px #17243a08;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  .global-site-header *{box-sizing:border-box}
  .global-site-header__inner{width:min(1780px,100% - 64px);min-height:94px;margin:auto;display:grid;grid-template-columns:170px minmax(0,1fr) auto;align-items:center;gap:clamp(20px,3vw,56px)}
  .global-site-header__brand{display:flex;align-items:center;gap:9px;width:max-content;color:#17243a;text-decoration:none}
  .global-site-header__mark{width:48px;height:60px;display:block;flex:none}
  .global-site-header__wordmark{display:flex;flex-direction:column;line-height:.92}
  .global-site-header__wordmark strong{font-size:22px;letter-spacing:.08em;font-weight:900}
  .global-site-header__wordmark small{margin-top:5px;color:#267eff;font-size:9px;font-style:italic;letter-spacing:.08em}
  .global-site-header__links{display:flex;align-items:center;justify-content:space-between;gap:clamp(14px,2.5vw,42px);min-width:0}
  .global-site-header__links a,.global-site-header__actions a,.global-site-header__language{color:#34445b;text-decoration:none;text-transform:uppercase;white-space:nowrap;font-size:12px;font-weight:650;letter-spacing:.045em;transition:color .18s ease}
  .global-site-header__links a:hover,.global-site-header__actions a:hover,.global-site-header__language:hover{color:#267eff}
  .global-site-header__actions{display:flex;align-items:center;justify-content:flex-end;gap:clamp(14px,2vw,30px)}
  .global-site-header__language{display:inline-flex;align-items:center;gap:7px}.global-site-header__flag{font-size:18px;line-height:1}.global-site-header__chevron{font-size:15px;line-height:1}
  .global-site-header__phone{display:flex;align-items:center;gap:8px;font-size:14px!important;font-weight:750!important}
  .global-site-header__phone svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
  .global-site-header__account{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1.8px solid #267eff;border-radius:50%;color:#267eff}
  .global-site-header__account svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  @media(max-width:1180px){.global-site-header__inner{width:calc(100% - 40px);grid-template-columns:130px minmax(0,1fr) auto;gap:20px}.global-site-header__links{gap:18px}.global-site-header__language{display:none}}
  @media(max-width:900px){.global-site-header__inner{width:calc(100% - 32px);min-height:86px;grid-template-columns:1fr auto;gap:4px 16px;padding:11px 0 8px}.global-site-header__links{grid-column:1/-1;grid-row:2;justify-content:flex-start;overflow-x:auto;overscroll-behavior-x:contain;padding:8px 1px 9px;gap:clamp(22px,5vw,44px);scrollbar-width:none;-webkit-overflow-scrolling:touch}.global-site-header__links::-webkit-scrollbar{display:none}.global-site-header__actions{grid-column:2;grid-row:1;gap:18px}.global-site-header__brand{gap:6px}.global-site-header__mark{width:39px;height:48px}.global-site-header__wordmark strong{font-size:20px}.global-site-header__links a{font-size:12px}}
  @media(max-width:520px){.global-site-header__inner{width:calc(100% - 28px);min-height:78px}.global-site-header__mark{width:34px;height:43px}.global-site-header__wordmark strong{font-size:18px}.global-site-header__wordmark small{font-size:8px}.global-site-header__actions{gap:12px}.global-site-header__phone{font-size:0!important;gap:0}.global-site-header__phone svg{width:21px;height:21px}.global-site-header__account{width:32px;height:32px}.global-site-header__links{gap:25px}.global-site-header__links a{font-size:11px}}
</style>
<header class="global-site-header">
  <div class="global-site-header__inner">
    <a class="global-site-header__brand" href="/" aria-label="LGS Cambodia home">
      <svg class="global-site-header__mark" viewBox="0 0 52 64" aria-hidden="true"><path d="M6 55h40M12 55V31l8-8v32m0-25 8-9 9 9v25m-9-18h9m-9 8h9M3 58h46" fill="none" stroke="#17243a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 23V12m8 1V5m9 18V12" fill="none" stroke="#267eff" stroke-width="2" stroke-linecap="round"/><path d="M6 60h40" stroke="#267eff" stroke-width="1.2"/></svg>
      <span class="global-site-header__wordmark"><strong>LGS</strong><small>Real Estate</small></span>
    </a>
    <nav class="global-site-header__links" aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="{% url 'property_search' %}?listing_type=RENT">Rent</a>
      <a href="{% url 'property_search' %}?listing_type=SALE">Buy</a>
      <a href="/#about">About</a>
      <a href="/#services">Services</a>
      <a href="/#contact">Contact</a>
      <a href="/#mobile-apps">Mobile apps</a>
    </nav>
    <div class="global-site-header__actions">
      <span class="global-site-header__language" aria-label="Current language: English"><span class="global-site-header__flag" aria-hidden="true">🇬🇧</span> English <span class="global-site-header__chevron" aria-hidden="true">⌄</span></span>
      <a class="global-site-header__phone" href="tel:+85578823833" aria-label="Call +855 78 823 833"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.6a15 15 0 0 0 5.9 5.9L16 13l5 2v4a2 2 0 0 1-2.2 2A18.8 18.8 0 0 1 3 5.2 2 2 0 0 1 5 3Z"/></svg> +855 78 823 833</a>
      {% if request.user.is_authenticated %}
        {% if request.user.role == 'ADMIN' %}<a class="global-site-header__account" href="{% url 'admin_dashboard' %}" aria-label="Open workspace"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></a>
        {% elif request.user.role == 'PROPERTY' %}<a class="global-site-header__account" href="{% url 'property_list' %}" aria-label="Open workspace"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></a>
        {% else %}<a class="global-site-header__account" href="{% url 'agent_dashboard' %}" aria-label="Open workspace"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></a>{% endif %}
      {% else %}
        <a class="global-site-header__account" href="{% url 'login' %}" aria-label="Team login"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></a>
      {% endif %}
    </div>
  </div>
</header>
